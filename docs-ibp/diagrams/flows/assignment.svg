<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="az" width="1280" height="990" viewBox="0 0 1280 990" role="img" aria-labelledby="title desc">
<title id="title">Təyinat: məsuliyyət görünürlük deyil</title>
<desc id="desc">TaskAssignmentService assignee-ni dəyişir; layihə üzvü bütün layihə işlərini görə bilər.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
</marker>
</defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}path,rect,ellipse{vector-effect:non-scaling-stroke}</style>
<rect width="1280" height="990" fill="#ffffff"/>
<text x="36" y="47" font-size="29" text-anchor="start" font-weight="700">Təyinat: məsuliyyət görünürlük deyil</text>
<text x="36" y="77" font-size="16" text-anchor="start" font-weight="400">TaskAssignmentService assignee-ni dəyişir; layihə üzvü bütün layihə işlərini görə bilər.</text>
<path d="M 340 215 L 340 270" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 340 380 L 340 440" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 340 530 L 340 590" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 600 325 L 900 325" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="760" y="310" font-size="15" text-anchor="middle" font-weight="400">qanunsuz target / actor</text>
<path d="M 600 485 L 900 485" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="760" y="470" font-size="15" text-anchor="middle" font-weight="400">eyni assignee</text>
<g>
<rect x="80" y="130" width="520" height="85" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="340" y="166" font-size="18" text-anchor="middle" font-weight="650">Entry policy → assignment DTO</text>
<text x="340" y="191" font-size="18" text-anchor="middle" font-weight="400">assignee_id: null və ya bir user</text>
</g>
<g>
<path d="M 340 270 L 600 325 L 340 380 L 80 325 Z" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="340" y="318.5" font-size="17" text-anchor="middle" font-weight="650">Active project + active actor?</text>
<text x="340" y="343.5" font-size="17" text-anchor="middle" font-weight="400">manager və ya self-assignment?</text>
</g>
<g>
<rect x="80" y="440" width="520" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="340" y="478.5" font-size="18" text-anchor="middle" font-weight="650">Target active project member</text>
<text x="340" y="503.5" font-size="18" text-anchor="middle" font-weight="400">bir assignee; mövcud assignee ilə müqayisə</text>
</g>
<g>
<rect x="900" y="285" width="280" height="80" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>
<text x="1040" y="318.5" font-size="18" text-anchor="middle" font-weight="650">Rədd et</text>
<text x="1040" y="343.5" font-size="18" text-anchor="middle" font-weight="400">dəyişiklik yoxdur</text>
</g>
<g>
<rect x="900" y="445" width="280" height="80" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="1040" y="478.5" font-size="18" text-anchor="middle" font-weight="650">No-op</text>
<text x="1040" y="503.5" font-size="18" text-anchor="middle" font-weight="400">yeni Activity yoxdur</text>
</g>
<rect x="50" y="585" width="1180" height="250" rx="18" fill="#ecfdf5" stroke="#059669" stroke-dasharray="7 5"/>
<text x="70" y="614" font-size="17" text-anchor="start" font-weight="650">Vahid DB transaction</text>
<path d="M 360 700 L 440 700" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 790 700 L 870 700" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g>
<rect x="80" y="650" width="280" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="220" y="693.5" font-size="18" text-anchor="middle" font-weight="650">assignee_id dəyiş</text>
<text x="220" y="718.5" font-size="18" text-anchor="middle" font-weight="400">version artır</text>
</g>
<g>
<rect x="440" y="650" width="350" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="615" y="693.5" font-size="18" text-anchor="middle" font-weight="650">Yeni assignee watcher olur</text>
<text x="615" y="718.5" font-size="18" text-anchor="middle" font-weight="400">unassign köhnə watch-i silmir</text>
</g>
<g>
<rect x="870" y="650" width="325" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="1032.5" y="693.5" font-size="18" text-anchor="middle" font-weight="650">Activity + notification</text>
<text x="1032.5" y="718.5" font-size="18" text-anchor="middle" font-weight="400">actor recipient deyil</text>
</g>
<g>
<rect x="80" y="770" width="1115" height="51" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="637.5" y="801.5" font-size="18" text-anchor="middle" font-weight="650">Manager başqasına assign/unassign edir; adi üzv yalnız özünə assign edir.</text>
</g>
<g>
<rect x="80" y="855" width="1115" height="51" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="637.5" y="886.5" font-size="18" text-anchor="middle" font-weight="650">Assignment status/rank endpoint-i deyil; expected_version müqaviləsini ona aid etməyək.</text>
</g>
<text x="36" y="967" font-size="14" text-anchor="start" font-weight="400">TaskFlow • cari kodun izahı • bütöv repo müqaviləsi üçün docs-ibp</text>
</svg>
