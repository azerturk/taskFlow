<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="az" width="1320" height="970" viewBox="0 0 1320 970" role="img" aria-labelledby="title desc">
<title id="title">Parol dəyişmə və administrator reset-i</title>
<desc id="desc">Hash yazısı və token/session revoke eyni use-case transaction-u daxilindədir.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
</marker>
</defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}path,rect,ellipse{vector-effect:non-scaling-stroke}</style>
<rect width="1320" height="970" fill="#ffffff"/>
<text x="36" y="47" font-size="29" text-anchor="start" font-weight="700">Parol dəyişmə və administrator reset-i</text>
<text x="36" y="77" font-size="16" text-anchor="start" font-weight="400">Hash yazısı və token/session revoke eyni use-case transaction-u daxilindədir.</text>
<rect x="45" y="120" width="590" height="690" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="7 5"/>
<text x="65" y="149" font-size="17" text-anchor="start" font-weight="650">Self-service: /account/password</text>
<rect x="675" y="120" width="590" height="690" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="695" y="149" font-size="17" text-anchor="start" font-weight="650">Admin reset: /admin/users/{user}/password</text>
<path d="M 340 265 L 340 330" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 340 445 L 340 510" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 340 625 L 340 690" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 970 265 L 970 330" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 970 445 L 970 510" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g>
<rect x="90" y="170" width="500" height="95" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="340" y="211" font-size="18" text-anchor="middle" font-weight="650">Form Request</text>
<text x="340" y="236" font-size="18" text-anchor="middle" font-weight="400">current_password:web + confirmed new password</text>
</g>
<g>
<rect x="90" y="330" width="500" height="115" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="340" y="368.5" font-size="18" text-anchor="middle" font-weight="650">AdminUserService.changeOwnPassword</text>
<text x="340" y="393.5" font-size="18" text-anchor="middle" font-weight="400">yeni hash + remember token</text>
<text x="340" y="418.5" font-size="18" text-anchor="middle" font-weight="400">bütün PAT-ləri revoke et</text>
</g>
<g>
<rect x="90" y="510" width="500" height="115" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="340" y="548.5" font-size="18" text-anchor="middle" font-weight="650">Cari session-dan başqa session-ları sil</text>
<text x="340" y="573.5" font-size="18" text-anchor="middle" font-weight="400">UserPasswordChanged safe audit</text>
<text x="340" y="598.5" font-size="18" text-anchor="middle" font-weight="400">transaction commit</text>
</g>
<g>
<rect x="90" y="690" width="500" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="340" y="723.5" font-size="18" text-anchor="middle" font-weight="650">Controller: cari session regenerate</text>
<text x="340" y="748.5" font-size="18" text-anchor="middle" font-weight="400">Web redirect</text>
</g>
<g>
<rect x="720" y="170" width="500" height="95" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="970" y="211" font-size="18" text-anchor="middle" font-weight="650">Admin Gate + validated reset DTO</text>
<text x="970" y="236" font-size="18" text-anchor="middle" font-weight="400">target user resolve</text>
</g>
<g>
<rect x="720" y="330" width="500" height="115" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="970" y="368.5" font-size="18" text-anchor="middle" font-weight="650">AdminUserService.resetPassword</text>
<text x="970" y="393.5" font-size="18" text-anchor="middle" font-weight="400">yeni hash + remember token</text>
<text x="970" y="418.5" font-size="18" text-anchor="middle" font-weight="400">bütün target PAT-ləri revoke et</text>
</g>
<g>
<rect x="720" y="510" width="500" height="115" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="970" y="548.5" font-size="18" text-anchor="middle" font-weight="650">Target-in bütün session-larını sil</text>
<text x="970" y="573.5" font-size="18" text-anchor="middle" font-weight="400">UserPasswordReset safe audit</text>
<text x="970" y="598.5" font-size="18" text-anchor="middle" font-weight="400">transaction commit</text>
</g>
<g>
<rect x="720" y="675" width="500" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="970" y="706.5" font-size="18" text-anchor="middle" font-weight="650">Admin target-in köhnə parolunu bilmir.</text>
<text x="970" y="731.5" font-size="18" text-anchor="middle" font-weight="400">Parol yalnız hash kimi saxlanır.</text>
</g>
<g>
<rect x="45" y="855" width="1220" height="76" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="655" y="886.5" font-size="18" text-anchor="middle" font-weight="650">Self-service-də yanlış current password input error-dur; database write başlamır.</text>
<text x="655" y="911.5" font-size="18" text-anchor="middle" font-weight="400">Audit/hash/token/password heç bir plain payload, log və Resource-a çıxarılmır.</text>
</g>
<text x="36" y="947" font-size="14" text-anchor="start" font-weight="400">TaskFlow • cari kodun izahı • bütöv repo müqaviləsi üçün docs-ibp</text>
</svg>
