<text x="680" y="996.5" font-size="18" text-anchor="middle" font-weight="650">Assignee adi keçidləri edir; done/cancelled-dən reopen yalnız manager-dir.</text>
<text x="680" y="1021.5" font-size="18" text-anchor="middle" font-weight="400">started_at ilk progress zamanı qorunur; completed_at done-da yazılır, reopen-da təmizlənir.</text>
<text x="680" y="1046.5" font-size="18" text-anchor="middle" font-weight="400">UI conflict-dən sonra cari server state-i yenidən oxumalıdır; backend authoritative-dir.</text>
