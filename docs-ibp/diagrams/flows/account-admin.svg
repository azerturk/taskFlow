<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="az" width="1400" height="1030" viewBox="0 0 1400 1030" role="img" aria-labelledby="title desc">
<title id="title">Daxili hesab: create, suspend, reactivate</title>
<desc id="desc">AdminUserService top-level transaction sahibidir; public registration yoxdur.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
</marker>
</defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}path,rect,ellipse{vector-effect:non-scaling-stroke}</style>
<rect width="1400" height="1030" fill="#ffffff"/>
<text x="36" y="47" font-size="29" text-anchor="start" font-weight="700">Daxili hesab: create, suspend, reactivate</text>
<text x="36" y="77" font-size="16" text-anchor="start" font-weight="400">AdminUserService top-level transaction sahibidir; public registration yoxdur.</text>
<rect x="45" y="120" width="1310" height="170" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="7 5"/>
<text x="65" y="149" font-size="17" text-anchor="start" font-weight="650">Create / update: admin Gate</text>
<path d="M 370 220 L 450 220" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 900 220 L 980 220" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g>
<rect x="75" y="175" width="295" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="222.5" y="213.5" font-size="18" text-anchor="middle" font-weight="650">Normalized email</text>
<text x="222.5" y="238.5" font-size="18" text-anchor="middle" font-weight="400">bir global role</text>
</g>
<g>
<rect x="450" y="175" width="450" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="675" y="213.5" font-size="18" text-anchor="middle" font-weight="650">Create: password hash + active user</text>
<text x="675" y="238.5" font-size="18" text-anchor="middle" font-weight="400">Update: identity / role; son admin qorunur</text>
</g>
<g>
<rect x="980" y="175" width="340" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="1150" y="213.5" font-size="18" text-anchor="middle" font-weight="650">Safe user Activity</text>
<text x="1150" y="238.5" font-size="18" text-anchor="middle" font-weight="400">secret payload yoxdur</text>
</g>
<path d="M 335 405 L 555 405" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="445" y="390" font-size="15" text-anchor="middle" font-weight="400">suspend</text>
<path d="M 825 405 L 1065 405" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="945" y="390" font-size="15" text-anchor="middle" font-weight="400">reactivate</text>
<g>
<rect x="65" y="355" width="270" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="200" y="411" font-size="18" text-anchor="middle" font-weight="650">active</text>
</g>
<g>
<rect x="555" y="355" width="270" height="100" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>
<text x="690" y="411" font-size="18" text-anchor="middle" font-weight="650">suspended</text>
</g>
<g>
<rect x="1065" y="355" width="270" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="1200" y="411" font-size="18" text-anchor="middle" font-weight="650">active</text>
</g>
<rect x="45" y="530" width="1310" height="260" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-dasharray="7 5"/>
<text x="65" y="559" font-size="17" text-anchor="start" font-weight="650">Suspend: vahid DB transaction</text>
<path d="M 365 665 L 435 665" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 820 665 L 900 665" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g>
<rect x="75" y="600" width="290" height="130" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>
<text x="220" y="646" font-size="18" text-anchor="middle" font-weight="650">Son aktiv admin yoxla</text>
<text x="220" y="671" font-size="18" text-anchor="middle" font-weight="400">açıq assignment-ları lock et</text>
<text x="220" y="696" font-size="18" text-anchor="middle" font-weight="400">unassign; version + Activity</text>
</g>
<g>
<rect x="435" y="600" width="385" height="130" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>
<text x="627.5" y="646" font-size="18" text-anchor="middle" font-weight="650">Bütün watcher-ləri sil</text>
<text x="627.5" y="671" font-size="18" text-anchor="middle" font-weight="400">bütün PAT + session-ları ləğv et</text>
<text x="627.5" y="696" font-size="18" text-anchor="middle" font-weight="400">status=suspended</text>
</g>
<g>
<rect x="900" y="600" width="420" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="1110" y="646" font-size="18" text-anchor="middle" font-weight="650">Uyğun watcher-lərə bildiriş</text>
<text x="1110" y="671" font-size="18" text-anchor="middle" font-weight="400">UserSuspended audit</text>
<text x="1110" y="696" font-size="18" text-anchor="middle" font-weight="400">state + cleanup birlikdə commit</text>
</g>
<g>
<rect x="45" y="835" width="1310" height="101" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="700" y="866.5" font-size="18" text-anchor="middle" font-weight="650">Reactivate yalnız yeni login imkanı verir; köhnə session/token/assignment/watcher-lər qaytarılmır.</text>
<text x="700" y="891.5" font-size="18" text-anchor="middle" font-weight="400">Done/cancelled tarixi assignee əlaqələri və reporter/Activity tarixçəsi saxlanır.</text>
<text x="700" y="916.5" font-size="18" text-anchor="middle" font-weight="400">Suspended actor Web/API/Livewire update-da yenidən active-user sərhədindən keçə bilmir.</text>
</g>
<text x="36" y="1007" font-size="14" text-anchor="start" font-weight="400">TaskFlow • cari kodun izahı • bütöv repo müqaviləsi üçün docs-ibp</text>
</svg>
