<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="az" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc">
<title id="title">Personal Access Token axını</title>
<desc id="desc">HTTP REST client token alır; plaintext yalnız issuance cavabında bir dəfə görünür.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
</marker>
</defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}path,rect,ellipse{vector-effect:non-scaling-stroke}</style>
<rect width="1320" height="900" fill="#ffffff"/>
<text x="36" y="47" font-size="29" text-anchor="start" font-weight="700">Personal Access Token axını</text>
<text x="36" y="77" font-size="16" text-anchor="start" font-weight="400">HTTP REST client token alır; plaintext yalnız issuance cavabında bir dəfə görünür.</text>
<g>
<rect x="45" y="125" width="210" height="60" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="150" y="161" font-size="18" text-anchor="middle" font-weight="650">API client</text>
</g>
<path d="M 150 185 L 150 620" stroke="#94a3b8" stroke-dasharray="5 5"/>
<g>
<rect x="355" y="125" width="210" height="60" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="460" y="161" font-size="18" text-anchor="middle" font-weight="650">Middleware / adapter</text>
</g>
<path d="M 460 185 L 460 620" stroke="#94a3b8" stroke-dasharray="5 5"/>
<g>
<rect x="675" y="125" width="210" height="60" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="780" y="161" font-size="18" text-anchor="middle" font-weight="650">AuthenticationService</text>
</g>
<path d="M 780 185 L 780 620" stroke="#94a3b8" stroke-dasharray="5 5"/>
<g>
<rect x="1035" y="125" width="210" height="60" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="1140" y="161" font-size="18" text-anchor="middle" font-weight="650">Repository / DB</text>
</g>
<path d="M 1140 185 L 1140 620" stroke="#94a3b8" stroke-dasharray="5 5"/>
<path d="M 150 245 L 460 245" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="305" y="234" font-size="15" text-anchor="middle" font-weight="400">POST /api/v1/auth/token</text>
<path d="M 460 320 L 780 320" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="620" y="309" font-size="15" text-anchor="middle" font-weight="400">5/dəq; input → canonical abilities → DTO</text>
<path d="M 780 395 L 1140 395" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="960" y="384" font-size="15" text-anchor="middle" font-weight="400">findByEmail; active + Hash::check</text>
<path d="M 780 465 L 1140 465" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="960" y="454" font-size="15" text-anchor="middle" font-weight="400">issue: hash saxla; safe audit yaz</text>
<path d="M 780 550 L 150 550" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="465" y="539" font-size="15" text-anchor="middle" font-weight="400">201: plaintext token — bir dəfə</text>
<g>
<rect x="40" y="650" width="590" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="335" y="681.5" font-size="18" text-anchor="middle" font-weight="650">Protected request: Bearer token + active account</text>
<text x="335" y="706.5" font-size="18" text-anchor="middle" font-weight="400">Ability record policy-ni əvəz etmir</text>
</g>
<g>
<rect x="680" y="650" width="590" height="76" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>
<text x="975" y="681.5" font-size="18" text-anchor="middle" font-weight="650">Yanlış/suspended credential → generic 422</text>
<text x="975" y="706.5" font-size="18" text-anchor="middle" font-weight="400">Limit → 429; hash/secret Resource-a çıxmır</text>
</g>
<rect x="40" y="760" width="1230" height="85" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="60" y="789" font-size="17" text-anchor="start" font-weight="650">Revoke: DELETE /api/v1/auth/token</text>
<g>
<rect x="65" y="792" width="1180" height="35" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="655" y="815.5" font-size="18" text-anchor="middle" font-weight="650">Yalnız cari token silinir → safe audit → 204 → təkrar istifadə 401</text>
</g>
<text x="36" y="877" font-size="14" text-anchor="start" font-weight="400">TaskFlow • cari kodun izahı • bütöv repo müqaviləsi üçün docs-ibp</text>
</svg>
