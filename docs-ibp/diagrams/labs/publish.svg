<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="az" width="1420" height="1170" viewBox="0 0 1420 1170" role="img" aria-labelledby="title desc">
<title id="title">R1: publish və faktiki outer commit</title>
<desc id="desc">After-commit event synchronous qalır; rollback-dən sonra listener işləməməlidir.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
</marker>
</defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}path,rect,ellipse{vector-effect:non-scaling-stroke}</style>
<rect width="1420" height="1170" fill="#ffffff"/>
<text x="36" y="47" font-size="29" text-anchor="start" font-weight="700">R1: publish və faktiki outer commit</text>
<text x="36" y="77" font-size="16" text-anchor="start" font-weight="400">After-commit event synchronous qalır; rollback-dən sonra listener işləməməlidir.</text>
<rect x="45" y="120" width="1330" height="240" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="7 5"/>
<text x="65" y="149" font-size="17" text-anchor="start" font-weight="650">Top-level publish: outer transaction yoxdur</text>
<path d="M 395 245 L 475 245" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 825 245 L 905 245" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g>
<rect x="75" y="190" width="320" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="235" y="226" font-size="18" text-anchor="middle" font-weight="650">PublishLearningEntryData</text>
<text x="235" y="251" font-size="18" text-anchor="middle" font-weight="400">trim; 1–255 simvol</text>
<text x="235" y="276" font-size="18" text-anchor="middle" font-weight="400">invalid title → write yoxdur</text>
</g>
<g>
<rect x="475" y="190" width="350" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="650" y="226" font-size="18" text-anchor="middle" font-weight="650">LearningEntryService</text>
<text x="650" y="251" font-size="18" text-anchor="middle" font-weight="400">DB transaction → entry insert</text>
<text x="650" y="276" font-size="18" text-anchor="middle" font-weight="400">transaction commit</text>
</g>
<g>
<rect x="905" y="190" width="435" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1122.5" y="226" font-size="18" text-anchor="middle" font-weight="650">LearningEntryPublished</text>
<text x="1122.5" y="251" font-size="18" text-anchor="middle" font-weight="400">ShouldDispatchAfterCommit</text>
<text x="1122.5" y="276" font-size="18" text-anchor="middle" font-weight="400">synchronous listener → projection</text>
</g>
<rect x="45" y="415" width="1330" height="330" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="7 5"/>
<text x="65" y="444" font-size="17" text-anchor="start" font-weight="650">Caller outer transaction açıb</text>
<path d="M 390 545 L 470 545" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 850 545 L 930 485" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="890" y="470" font-size="15" text-anchor="middle" font-weight="400">outer COMMIT</text>
<path d="M 850 545 L 930 645" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="890" y="665" font-size="15" text-anchor="middle" font-weight="400">outer ROLLBACK</text>
<g>
<rect x="75" y="490" width="315" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="232.5" y="526" font-size="18" text-anchor="middle" font-weight="650">Caller begin</text>
<text x="232.5" y="551" font-size="18" text-anchor="middle" font-weight="400">publish daxili transaction-u</text>
<text x="232.5" y="576" font-size="18" text-anchor="middle" font-weight="400">faktiki commit hələ deyil</text>
</g>
<g>
<rect x="470" y="490" width="380" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="660" y="526" font-size="18" text-anchor="middle" font-weight="650">Laravel dispatcher</text>
<text x="660" y="551" font-size="18" text-anchor="middle" font-weight="400">event callback-i saxlayır</text>
<text x="660" y="576" font-size="18" text-anchor="middle" font-weight="400">outer commit-i gözləyir</text>
</g>
<g>
<rect x="930" y="440" width="410" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="1135" y="478.5" font-size="18" text-anchor="middle" font-weight="650">Listener işləyir</text>
<text x="1135" y="503.5" font-size="18" text-anchor="middle" font-weight="400">Catalog row artıq committed-dir</text>
</g>
<g>
<rect x="930" y="600" width="410" height="90" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>
<text x="1135" y="638.5" font-size="18" text-anchor="middle" font-weight="650">Callback atılır</text>
<text x="1135" y="663.5" font-size="18" text-anchor="middle" font-weight="400">entry yoxdur; projection yoxdur</text>
</g>
<g>
<rect x="45" y="800" width="1330" height="101" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="710" y="831.5" font-size="18" text-anchor="middle" font-weight="650">Listener yoxdursa publish uğurludur. Listener xəta atarsa caller exception ala bilər, Catalog committed qalır.</text>
<text x="710" y="856.5" font-size="18" text-anchor="middle" font-weight="400">Belə failure-də publish-i kor təkrarlamaq ikinci entry yaradar; public-feed rebuild recovery yoludur.</text>
<text x="710" y="881.5" font-size="18" text-anchor="middle" font-weight="400">Commit ilə dispatch arasında proses dayanarsa event itə bilər: queue/outbox/inbox zəmanəti yoxdur.</text>
</g>
<g>
<rect x="45" y="945" width="1330" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="710" y="976.5" font-size="18" text-anchor="middle" font-weight="650">Real commit sübutu: R1LearningFlowTest + DatabaseMigrations; Event::fake və outer RefreshDatabase ilə əvəz edilmir.</text>
<text x="710" y="1001.5" font-size="18" text-anchor="middle" font-weight="400">Bu laboratoriyanın event əlaqəsi mövcud TaskFlow məhsul modullarını refaktor etmir.</text>
</g>
<text x="36" y="1147" font-size="14" text-anchor="start" font-weight="400">TaskFlow • cari kodun izahı • bütöv repo müqaviləsi üçün docs-ibp</text>
</svg>
