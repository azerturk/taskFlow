<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="az" width="1360" height="880" viewBox="0 0 1360 880" role="img" aria-labelledby="title desc">
<title id="title">R1 laboratoriyasının məlumat modeli</title>
<desc id="desc">İki cədvəl eyni database-dədir, amma ayrı modul sahibliyindədir; aralarında FK yoxdur.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
</marker>
</defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}path,rect,ellipse{vector-effect:non-scaling-stroke}</style>
<rect width="1360" height="880" fill="#ffffff"/>
<text x="36" y="47" font-size="29" text-anchor="start" font-weight="700">R1 laboratoriyasının məlumat modeli</text>
<text x="36" y="77" font-size="16" text-anchor="start" font-weight="400">İki cədvəl eyni database-dədir, amma ayrı modul sahibliyindədir; aralarında FK yoxdur.</text>
<rect x="45" y="130" width="590" height="520" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="7 5"/>
<text x="65" y="159" font-size="17" text-anchor="start" font-weight="650">LearningCatalog sahibdir</text>
<rect x="685" y="130" width="625" height="520" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="7 5"/>
<text x="705" y="159" font-size="17" text-anchor="start" font-weight="650">LearningInsights sahibdir</text>
<g>
<path d="M 100 220 C 100 200,580 200,580 220 L 580 530 C 580 550,100 550,100 530 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<ellipse cx="340" cy="220" rx="240" ry="15" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="340" y="338" font-size="17" text-anchor="middle" font-weight="650">r1_learning_entries</text>
<text x="340" y="363" font-size="17" text-anchor="middle" font-weight="400">id: primary key</text>
<text x="340" y="388" font-size="17" text-anchor="middle" font-weight="400">title: string(255)</text>
<text x="340" y="413" font-size="17" text-anchor="middle" font-weight="400">published_at</text>
<text x="340" y="438" font-size="17" text-anchor="middle" font-weight="400">created_at / updated_at</text>
</g>
<g>
<path d="M 735 220 C 735 200,1255 200,1255 220 L 1255 530 C 1255 550,735 550,735 530 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<ellipse cx="995" cy="220" rx="260" ry="15" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="995" y="338" font-size="17" text-anchor="middle" font-weight="650">r1_learning_insight_entries</text>
<text x="995" y="363" font-size="17" text-anchor="middle" font-weight="400">id: primary key</text>
<text x="995" y="388" font-size="17" text-anchor="middle" font-weight="400">entry_id: UNIQUE, bigint</text>
<text x="995" y="413" font-size="17" text-anchor="middle" font-weight="400">source_event_id: UNIQUE, nullable UUID</text>
<text x="995" y="438" font-size="17" text-anchor="middle" font-weight="400">title / published_at / timestamps</text>
</g>
<path d="M 580 355 L 735 355" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="655" y="335" font-size="15" text-anchor="middle" font-weight="400">logical identity</text>
<g>
<rect x="100" y="570" width="480" height="76" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="340" y="601.5" font-size="18" text-anchor="middle" font-weight="650">Source of truth: publish edilmiş learning entry</text>
<text x="340" y="626.5" font-size="18" text-anchor="middle" font-weight="400">title normallaşdırılır; update/delete yoxdur</text>
</g>
<g>
<rect x="735" y="570" width="520" height="76" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="995" y="601.5" font-size="18" text-anchor="middle" font-weight="650">Read projection: event və ya rebuild ilə yaranır</text>
<text x="995" y="626.5" font-size="18" text-anchor="middle" font-weight="400">Catalog-a write və birbaşa table query yoxdur</text>
</g>
<g>
<rect x="45" y="705" width="1265" height="101" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="677.5" y="736.5" font-size="18" text-anchor="middle" font-weight="650">Kəsik əlaqə FK deyil: Insights Catalog-u contract/event vasitəsilə tanıyır.</text>
<text x="677.5" y="761.5" font-size="18" text-anchor="middle" font-weight="400">Məhsul modullarına/user/project/task cədvəllərinə bağlılıq yoxdur.</text>
<text x="677.5" y="786.5" font-size="18" text-anchor="middle" font-weight="400">Rebuild-lə yaranmış sətirdə source_event_id null qala bilər; tam event ledger saxlanmır.</text>
</g>
<text x="36" y="857" font-size="14" text-anchor="start" font-weight="400">TaskFlow • cari kodun izahı • bütöv repo müqaviləsi üçün docs-ibp</text>
</svg>
